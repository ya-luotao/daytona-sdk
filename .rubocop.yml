plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "pkg/**/*"

# Layout
Layout/LineLength:
  Max: 120
  AllowedPatterns:
    - '^\s*#'

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

# Metrics
# The methods listed below are inherently complex: they either map a large,
# loosely-typed API payload onto attributes (process_sandbox_data, from_hash,
# build_create_sandbox_body) or dispatch/normalize responses (handle_response,
# get, list, create). They are exempted rather than artificially split.
Metrics/AbcSize:
  Max: 25
  AllowedMethods:
    - process_sandbox_data
    - build_create_sandbox_body
    - handle_response
    - get
    - list
    - create

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/ClassLength:
  Max: 250

Metrics/CyclomaticComplexity:
  AllowedMethods:
    - process_sandbox_data
    - build_create_sandbox_body
    - handle_response
    - get
    - list
    - create
    - initialize
    - from_hash
    - run_code
    - format_pip_install_args

Metrics/PerceivedComplexity:
  AllowedMethods:
    - process_sandbox_data
    - build_create_sandbox_body
    - handle_response
    - get
    - list
    - create
    - from_hash
    - run_code

Metrics/MethodLength:
  Max: 25
  AllowedMethods:
    - handle_response
    - get
    - list
    - build_create_sandbox_body

Metrics/ParameterLists:
  Max: 8
  CountKeywordArgs: false

# Naming
Naming/FileName:
  Exclude:
    - "Gemfile"
    - "Rakefile"

# The public API mirrors the official Daytona SDKs, which use get_/set_ prefixes
# (e.g. get_user_home_dir, set_labels). Renaming would break compatibility.
Naming/AccessorMethodName:
  Enabled: false

# Allow short, conventional names (e.g. x/y screen coordinates, io streams).
Naming/MethodParameterName:
  AllowedNames:
    - x
    - y
    - io
    - id
    - to

# Documented streaming callbacks (on_stderr, on_error) are part of the public
# signature even on code paths that don't currently invoke them.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true

# Bang methods that raise on failure are not predicates.
Naming/PredicateMethod:
  AllowBangMethods: true

# Style
Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: true

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma

# RSpec
RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Max: 6

RSpec/NestedGroups:
  Max: 4

# Related classes (e.g. Client + PaginatedSandboxes) are grouped in a single
# spec file, matching the existing spec layout.
RSpec/MultipleDescribes:
  Enabled: false

# `expect(...).to receive` is the project's chosen mocking style.
RSpec/MessageSpies:
  Enabled: false
